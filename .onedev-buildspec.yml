version: 54
jobs:
- name: build
  jobExecutor: ces-build-test
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
  - type: CommandStep
    name: probe
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: |
        set -euo pipefail
        uname -a
        git log -1 --oneline
        docker version --format '{{.Server.Version}}'
        docker buildx version
    condition: SUCCESSFUL
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
