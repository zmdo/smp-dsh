version: 54
jobs:
- name: build
  jobExecutor: ces-build-test
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
  - type: CommandStep
    name: image
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: |
        set -euo pipefail
        image="ces-candidate:build-@build_number@"
        docker build --network=host -t "$image" -f docker/Dockerfile .
        id=$(docker image inspect --format '{{.Id}}' "$image")
        commit=$(git rev-parse HEAD)
        printf '{"build":"@build_number@","commit":"%s","image":"%s","id":"%s"}\n' "$commit" "$image" "$id" > image.json
        cat image.json
    condition: SUCCESSFUL
  - type: PublishArtifactStep
    name: image info
    artifacts: image.json
    condition: SUCCESSFUL
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  retryCondition: never
  maxAttempts: 1
  retryDelay: 60
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600
- name: candidate
  jobExecutor: ces-build-test
  paramSpecs:
  - type: TextParam
    name: image
    description: image id or reference produced by the build job
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
  - type: CommandStep
    name: deploy
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: |
        set -euo pipefail
        bash scripts/deploy-candidate.sh "@param:image@" /srv/ces-test/candidate.env
    condition: SUCCESSFUL
  retryCondition: never
  maxAttempts: 1
  retryDelay: 60
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600
